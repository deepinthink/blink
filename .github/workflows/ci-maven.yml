name: CI Maven

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Setup deepinthink/amoeba
        uses: deepinthink/amoeba/.github/actions/setup-amoeba/java@main

      - name: Setup deepinthink/blink
        uses: ./.github/actions/setup-blink/java
